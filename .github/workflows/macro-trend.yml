name: Macro - Trend Brief

on:
  workflow_dispatch:
  # 텔레그램 자동발송 중단(2026-07-16): 스케줄 비활성화. 수동 실행만 가능.
  # schedule:
  #   # KST 평일 09:00 = UTC 월~금 00:00 (war 07시·credit 08시 다음 슬롯)
  #   - cron: "0 0 * * 1-5"

jobs:
  trend-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Prepare prompt with current date
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed "s/{{TODAY}}/$TODAY/g" prompts/trend.md > prompt.txt
          echo "--- Prompt prepared (first 500 chars) ---"
          head -c 500 prompt.txt
          echo ""
          echo "--- Total length: $(wc -c < prompt.txt) chars ---"

      - name: Run Claude analysis (with retry)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          max_attempts=3
          attempt=0
          success=false
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "=== Claude analysis attempt $attempt/$max_attempts ==="
            rm -f claude_output.txt claude_stderr.txt
            set +e
            cat prompt.txt | claude -p \
              --permission-mode bypassPermissions \
              --max-turns 50 \
              --output-format text \
              > claude_output.txt 2> claude_stderr.txt
            code=$?
            set -e
            # 성공 = 종료코드 0 + 출력 파일이 존재하고 공백 아닌 내용을 가짐
            if [ $code -eq 0 ] && [ -s claude_output.txt ] && grep -q '[^[:space:]]' claude_output.txt; then
              echo "--- Output length: $(wc -c < claude_output.txt) chars ---"
              echo "--- First 500 chars ---"
              head -c 500 claude_output.txt
              echo ""
              success=true
              break
            fi
            echo "Attempt $attempt failed (exit=$code, output_bytes=$(wc -c < claude_output.txt 2>/dev/null || echo 0))"
            echo "--- stderr (tail) ---"
            tail -c 1000 claude_stderr.txt 2>/dev/null || true
            if [ $attempt -lt $max_attempts ]; then
              echo "retrying in 20s..."
              sleep 20
            fi
          done
          if [ "$success" != "true" ]; then
            echo "All $max_attempts attempts failed — empty or missing output."
            exit 1
          fi

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x scripts/send_telegram.sh
          HEADER="🔥 [Trend Brief] $(date -u +%Y-%m-%d) UTC"
          {
            echo "$HEADER"
            echo ""
            cat claude_output.txt
          } | ./scripts/send_telegram.sh

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x scripts/send_telegram.sh
          ERR="$(tail -c 800 claude_stderr.txt 2>/dev/null)"
          [ -z "$ERR" ] && ERR="(stderr 없음 — 출력이 비었거나 파일이 생성되지 않음)"
          {
            echo "⚠️ [Trend Brief] 자동 발송 실패 — $(date -u +%Y-%m-%d\ %H:%M) UTC"
            echo "재시도 후에도 Claude 분석 결과가 비어 브리핑을 보내지 못했습니다."
            echo ""
            echo "--- stderr (마지막 부분) ---"
            echo "$ERR"
            echo ""
            echo "실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | ./scripts/send_telegram.sh || true
