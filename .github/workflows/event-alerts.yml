name: Event Alerts

# 보유·관심 종목 공시(SEC·DART) + 매크로 경보선·급변 + 예측시장 급변 + 정책 발표
# + 판정일 전날 알림 → 새 이벤트가 있을 때만 텔레그램 무음 발송. 감지는 규칙 기반.
# Claude는 실적 공시 원문 채점에만 쓴다 (실행 1회당 최대 2건).
on:
  workflow_dispatch:
    inputs:
      status:
        description: "경보선 현황 스냅샷도 함께 발송"
        type: boolean
        default: true
      test_score:
        description: "(시험) 이 종목의 최근 실적 공시를 Claude로 채점 — 티커 입력, 비우면 안 함"
        type: string
        default: ""
  schedule:
    # 15분마다. ⚠️ 정각·15/30/45분은 GitHub 큐가 가장 혼잡해 크게 밀린다
    # (2026-09-11~14 실측: */15로 돌렸더니 실제 간격 중앙값 164분·최대 339분)
    # → 혼잡하지 않은 분(7·22·37·52)으로 옮겨 지연을 줄인다
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: event-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 중복 발송 방지용 상태(본 공시 목록·경보선 점등 여부)를 캐시로 이어받는다
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: alerts/state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-

      - name: Run alerts
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TEST_SCORE_TICKER: ${{ inputs.test_score }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.status }}" = "true" ]; then
            ARGS="--status"
          fi
          python3 alerts/run.py $ARGS

      # 실적 공시 채점 또는 핫이슈 요약이 필요할 때만 Claude를 부른다
      - name: Setup Node
        if: steps.run.outputs.score == 'true' || steps.run.outputs.news == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        if: steps.run.outputs.score == 'true' || steps.run.outputs.news == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: News digest
        if: steps.run.outputs.news == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 alerts/news.py

      - name: Score earnings filings
        if: steps.run.outputs.score == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python3 alerts/score.py

      - name: Save state
        if: always() && hashFiles('alerts/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: alerts/state.json
          key: alerts-state-${{ github.run_id }}-${{ github.run_attempt }}
